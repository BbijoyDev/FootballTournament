<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <title>Football Tournament</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">⚽</span>
        <div>
          <p class="eyebrow">COMMUNITY FOOTBALL</p>
          <h1 id="tournamentTitle">Tournament</h1>
        </div>
      </div>
      <button id="modeButton" class="secondary-button" type="button">Admin mode</button>
    </header>

    <main class="app-shell">
      <section id="setupNotice" class="notice hidden"></section>

      <section id="publicView">
        <nav id="publicTabs" class="tabs" aria-label="Tournament views"></nav>
        <div id="publicContent"></div>
      </section>

      <section id="adminView" class="hidden">
        <div id="authPanel" class="card">
          <h2>Administrator sign in</h2>
          <form id="loginForm" class="inline-form">
            <input id="adminEmail" type="email" placeholder="Administrator email" required />
            <input id="adminPassword" type="password" placeholder="Password" required />
            <button type="submit">Sign in</button>
          </form>
          <p id="authMessage" class="muted"></p>
        </div>

        <div id="adminPanel" class="hidden">
          <div id="emailVerificationPanel" class="card hidden">
            <h2>Verify your email address</h2>
            <p class="muted">Scorekeeper permissions are available only to the verified owner of the granted email address.</p>
            <div class="action-row">
              <button id="sendVerificationButton" type="button">Send verification email</button>
              <button id="checkVerificationButton" class="secondary-button" type="button">I've verified it</button>
            </div>
          </div>
          <div class="admin-toolbar">
            <select id="tournamentSelect" aria-label="Select tournament"></select>
            <button id="newTournamentButton" class="secondary-button" type="button">New tournament</button>
            <button id="signOutButton" class="secondary-button" type="button">Sign out</button>
          </div>
          <p id="adminMessage" class="muted" role="status" aria-live="polite"></p>

          <div id="newTournamentPanel" class="card hidden">
            <h2>Create tournament</h2>
            <form id="newTournamentForm" class="inline-form">
              <input id="newTournamentName" placeholder="Tournament name" required />
              <button type="submit">Create</button>
              <button id="cancelNewTournament" class="secondary-button" type="button">Cancel</button>
            </form>
          </div>

          <nav id="adminTabs" class="tabs" aria-label="Administration"></nav>
          <div id="adminContent"></div>
        </div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
